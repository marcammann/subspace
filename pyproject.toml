[project]
name = "subspace"
version = "0.1.0"
description = "Streaming-first API middleware/proxy for LLM models and agents"
readme = "README.md"
authors = [
    { name = "Marc Ammann", email = "marc@easy.day" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.2",
    "httpx>=0.27",
    "litellm>=1.83.14",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
langfuse = ["langfuse>=2.0"]
langchain = ["langchain-core>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mcp>=1.0",
    "langfuse>=2.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["subspace"]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"
